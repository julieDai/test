datapath=../../data/ethnobotany/H_D.txt
data.dir=../../data/ethnobotany
embedding.dir=../../artifacts/ethnobotany/features
text.fusion.alpha=1.0
negative.file=../../data/ethnobotany/negativehdlist.txt
ratings.setup=-columns 0 1 2
model.name=HerbHG
evaluation.setup=-cv 5
num.factors=64
num.max.epoch=200
batch_size=1000
learnRate=-init 0.0001 -max 1
reg.lambda=-u 0.001 -i 0.001 -b 0.2 -s 0.2
output.setup=on -dir ../../outputs/ethnobotany/herbhg
astra.n_layers=5
astra.loss.kind=legacy
astra.loss.reduction=sum
astra.grad.clip_value=10.0
astra.grad.clip_norm=0.5
astra.protein_gate=false
astra.dead_variables=preserve
astra.clique.sampling=legacy_prefix
astra.clique.max_pairs_per_hyperedge=100
astra.clique.max_directed_edges=200000
astra.checkpoint.epochs=30,60,100,200
astra.semantic.adapter=residual_mlp
astra.semantic.input_dim=64
astra.semantic.freeze_input=false
astra.semantic.mlp_hidden_dim=32
astra.training.trace_gradients=false
